[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h3-urban-agent-benchmark"
version = "1.0.0"
description = "Continuous-indexed vs multiresolution H3 urban-agent benchmark"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "h3>=4.1",
  "scikit-learn>=1.4",
  "scipy>=1.13",
  "psutil>=5.9",
  "matplotlib>=3.9",
  "osmnx>=2.0",
  "networkx>=3.3",
  "geopandas>=1.0",
  "shapely>=2.0",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]
